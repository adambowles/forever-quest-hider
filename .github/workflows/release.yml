name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require tagged commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate version and package addon
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/package.py "$RELEASE_TAG"
      - name: Publish installable addon
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --title "Forever Quest Hider $RELEASE_TAG" --generate-notes
